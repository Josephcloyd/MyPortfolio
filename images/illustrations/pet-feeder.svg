<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Illustration: an automated pet feeder with a food hopper, servo-driven gate, bowl, and microcontroller on a schedule">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1b1b20"/></pattern>
    <radialGradient id="glow" cx="40%" cy="45%" r="60%"><stop offset="0" stop-color="#a3e635" stop-opacity=".12"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="#0d0d10"/>
  <rect width="1600" height="1000" fill="url(#g)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <!-- Floor -->
    <line x1="160" y1="860" x2="1440" y2="860" stroke="#2a2a2f" stroke-width="2"/>
    <!-- Hopper -->
    <path d="M420 150h360l-70 300H490z" fill="#141417" stroke="#3f3f46" stroke-width="3"/>
    <path d="M440 170h320" stroke="#2a2a2f" stroke-width="2"/>
    <g fill="#a3e635">
      <circle cx="520" cy="360" r="14"/><circle cx="556" cy="378" r="13" fill-opacity=".8"/><circle cx="596" cy="360" r="14" fill-opacity=".9"/>
      <circle cx="636" cy="380" r="13" fill-opacity=".7"/><circle cx="672" cy="360" r="14" fill-opacity=".85"/><circle cx="540" cy="404" r="13" fill-opacity=".6"/>
      <circle cx="580" cy="416" r="14" fill-opacity=".75"/><circle cx="620" cy="410" r="13" fill-opacity=".9"/><circle cx="660" cy="404" r="14" fill-opacity=".6"/>
      <circle cx="560" cy="330" r="13" fill-opacity=".5"/><circle cx="640" cy="330" r="13" fill-opacity=".55"/><circle cx="600" cy="300" r="13" fill-opacity=".4"/>
    </g>
    <!-- Gate + servo -->
    <rect x="486" y="450" width="228" height="56" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
    <rect x="740" y="456" width="96" height="44" rx="8" fill="#27272a" stroke="#52525b" stroke-width="2"/>
    <circle cx="762" cy="478" r="12" fill="#a3e635"/>
    <text x="732" y="540" fill="#a1a1aa" font-size="20">servo</text>
    <!-- Chute -->
    <path d="M560 506h80l-14 150h-52z" fill="#141417" stroke="#3f3f46" stroke-width="3"/>
    <circle cx="600" cy="600" r="10" fill="#a3e635" fill-opacity=".8"/><circle cx="592" cy="636" r="9" fill="#a3e635" fill-opacity=".6"/>
    <!-- Bowl -->
    <path d="M440 760h320l-40 100H480z" fill="#18181b" stroke="#52525b" stroke-width="3"/>
    <ellipse cx="600" cy="760" rx="160" ry="22" fill="#141417" stroke="#52525b" stroke-width="3"/>
    <g fill="#a3e635"><circle cx="560" cy="756" r="11"/><circle cx="594" cy="752" r="11" fill-opacity=".8"/><circle cx="628" cy="758" r="11" fill-opacity=".9"/><circle cx="660" cy="752" r="10" fill-opacity=".6"/></g>
    <!-- Microcontroller -->
    <rect x="1000" y="420" width="300" height="200" rx="14" fill="#141417" stroke="#3f3f46" stroke-width="3"/>
    <g fill="#52525b">
      <rect x="1024" y="404" width="10" height="18"/><rect x="1054" y="404" width="10" height="18"/><rect x="1084" y="404" width="10" height="18"/><rect x="1114" y="404" width="10" height="18"/><rect x="1144" y="404" width="10" height="18"/><rect x="1174" y="404" width="10" height="18"/><rect x="1204" y="404" width="10" height="18"/><rect x="1234" y="404" width="10" height="18"/><rect x="1264" y="404" width="10" height="18"/>
      <rect x="1024" y="618" width="10" height="18"/><rect x="1054" y="618" width="10" height="18"/><rect x="1084" y="618" width="10" height="18"/><rect x="1114" y="618" width="10" height="18"/><rect x="1144" y="618" width="10" height="18"/><rect x="1174" y="618" width="10" height="18"/><rect x="1204" y="618" width="10" height="18"/><rect x="1234" y="618" width="10" height="18"/><rect x="1264" y="618" width="10" height="18"/>
    </g>
    <rect x="1100" y="470" width="100" height="100" rx="8" fill="#27272a" stroke="#52525b" stroke-width="2"/>
    <text x="1122" y="528" fill="#a3e635" font-size="24" font-weight="700">MCU</text>
    <circle cx="1270" cy="450" r="7" fill="#a3e635"/>
    <!-- Wire to servo -->
    <path d="M1000 520H900q-30 0-30-30v-12h-34" fill="none" stroke="#a3e635" stroke-width="3" stroke-dasharray="10 8"/>
    <!-- Schedule card -->
    <rect x="1000" y="680" width="300" height="140" rx="14" fill="#141417" stroke="#2a2a2f" stroke-width="2"/>
    <circle cx="1052" cy="750" r="30" fill="none" stroke="#a3e635" stroke-width="4"/>
    <path d="M1052 734v18l12 8" fill="none" stroke="#a3e635" stroke-width="4" stroke-linecap="round"/>
    <text x="1104" y="738" fill="#f4f4f5" font-size="20">schedule</text>
    <rect x="1104" y="756" width="150" height="10" rx="5" fill="#3f3f46"/><rect x="1104" y="778" width="110" height="10" rx="5" fill="#3f3f46"/>
    <path d="M1150 680v-60" stroke="#3f3f46" stroke-width="3" stroke-dasharray="8 8"/>
  </g>
</svg>
