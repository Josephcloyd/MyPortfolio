<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Illustration: a smart backpack with GPS tracking, a geofence on a map, and a phone alert">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1b1b20"/></pattern>
    <radialGradient id="glow" cx="60%" cy="45%" r="60%"><stop offset="0" stop-color="#a3e635" stop-opacity=".12"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="#0d0d10"/>
  <rect width="1600" height="1000" fill="url(#g)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <!-- Backpack -->
    <path d="M330 300q0-110 120-110h40q120 0 120 110v480q0 40-40 40H370q-40 0-40-40z" fill="#141417" stroke="#52525b" stroke-width="4"/>
    <path d="M410 190q0-60 60-60t60 60" fill="none" stroke="#52525b" stroke-width="4"/>
    <rect x="370" y="520" width="200" height="200" rx="24" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
    <path d="M370 590h200" stroke="#3f3f46" stroke-width="3"/>
    <rect x="410" y="340" width="120" height="110" rx="12" fill="#27272a" stroke="#a3e635" stroke-width="2"/>
    <circle cx="470" cy="395" r="26" fill="#0d0d10" stroke="#a3e635" stroke-width="3"/>
    <circle cx="470" cy="395" r="8" fill="#a3e635"/>
    <g fill="none" stroke="#a3e635" stroke-linecap="round" stroke-width="4"><path d="M600 300q26 26 0 52" stroke-opacity=".9"/><path d="M630 270q50 56 0 112" stroke-opacity=".55"/><path d="M660 240q76 86 0 172" stroke-opacity=".3"/></g>
    <!-- Map -->
    <rect x="780" y="160" width="660" height="520" rx="18" fill="#141417" stroke="#2a2a2f" stroke-width="2"/>
    <g stroke="#232328" stroke-width="10" fill="none" stroke-linecap="round">
      <path d="M800 300h620"/><path d="M800 520h620"/><path d="M960 180v480"/><path d="M1260 180v480"/><path d="M800 640l300-280 320 120"/>
    </g>
    <circle cx="1110" cy="420" r="170" fill="#a3e635" fill-opacity=".06" stroke="#a3e635" stroke-width="3" stroke-dasharray="12 10"/>
    <path d="M880 600q90-60 150-130t150-60q60 0 90-40" fill="none" stroke="#a3e635" stroke-width="5" stroke-linecap="round"/>
    <circle cx="880" cy="600" r="10" fill="#52525b"/>
    <path d="M1270 330c0-26 20-44 44-44s44 18 44 44c0 34-44 76-44 76s-44-42-44-76z" fill="#a3e635"/>
    <circle cx="1314" cy="330" r="14" fill="#0d0d10"/>
    <text x="808" y="200" fill="#a1a1aa" font-size="18">gps · location</text>
    <!-- Alert -->
    <rect x="900" y="730" width="440" height="120" rx="18" fill="#141417" stroke="#a3e635" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="960" cy="790" r="26" fill="#a3e635" fill-opacity=".18" stroke="#a3e635" stroke-width="2"/>
    <path d="M960 776v18M960 802v2" stroke="#a3e635" stroke-width="5" stroke-linecap="round"/>
    <text x="1004" y="782" fill="#f4f4f5" font-size="20">location alert</text>
    <rect x="1004" y="800" width="250" height="10" rx="5" fill="#52525b"/>
  </g>
</svg>
