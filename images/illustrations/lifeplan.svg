    <text x="1196" y="230" fill="#71717a" font-size="16">request</text>
    <rect x="1196" y="252" width="250" height="44" rx="14" fill="#27272a"/>
    <rect x="1214" y="268" width="180" height="12" rx="6" fill="#71717a"/>
    <rect x="1236" y="312" width="230" height="44" rx="14" fill="#a3e635" fill-opacity=".16" stroke="#a3e635" stroke-opacity=".5"/>
    <rect x="1256" y="328" width="150" height="12" rx="6" fill="#a3e635"/>
