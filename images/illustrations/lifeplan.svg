    <rect x="340" y="384" width="740" height="466" rx="12" fill="#18181b" stroke="#26262b"/>
    <g stroke="#232328">
      <line x1="500" y1="404" x2="500" y2="830"/><line x1="645" y1="404" x2="645" y2="830"/><line x1="790" y1="404" x2="790" y2="830"/><line x1="935" y1="404" x2="935" y2="830"/>
    </g>
    <g fill="#3f3f46">
      <rect x="360" y="430" width="110" height="12" rx="6"/><rect x="360" y="500" width="90" height="12" rx="6"/><rect x="360" y="570" width="120" height="12" rx="6"/>
      <rect x="360" y="640" width="96" height="12" rx="6"/><rect x="360" y="710" width="110" height="12" rx="6"/><rect x="360" y="780" width="80" height="12" rx="6"/>
    </g>
    <rect x="510" y="420" width="250" height="32" rx="8" fill="#a3e635"/>
    <rect x="600" y="490" width="300" height="32" rx="8" fill="#a3e635" fill-opacity=".7"/>
    <rect x="700" y="560" width="220" height="32" rx="8" fill="#a3e635" fill-opacity=".5"/>
    <rect x="540" y="630" width="180" height="32" rx="8" fill="#52525b"/>
    <rect x="820" y="700" width="230" height="32" rx="8" fill="#a3e635" fill-opacity=".35"/>
    <rect x="910" y="770" width="150" height="32" rx="8" fill="#52525b"/>
