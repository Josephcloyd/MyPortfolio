    <path d="M1330 400v70" stroke="#a3e635" stroke-width="3" stroke-dasharray="8 8"/>
    <path d="M1318 462l12 16 12-16" fill="none" stroke="#a3e635" stroke-width="3"/>
    <path d="M1100 520h60" stroke="#3f3f46" stroke-width="3" stroke-dasharray="8 8"/>
    <!-- Workbook card -->
    <rect x="1170" y="490" width="320" height="300" rx="18" fill="#141417" stroke="#2a2a2f" stroke-width="2"/>
    <rect x="1196" y="520" width="44" height="54" rx="6" fill="#a3e635"/>
    <path d="M1206 536l24 26M1230 536l-24 26" stroke="#0d0d10" stroke-width="5"/>
    <text x="1256" y="545" fill="#f4f4f5" font-size="20">plan.xlsx</text>
    <text x="1256" y="570" fill="#71717a" font-size="15">generated</text>
    <g stroke="#2e2e34">
      <rect x="1196" y="600" width="268" height="164" fill="#18181b"/>
      <line x1="1196" y1="633" x2="1464" y2="633"/><line x1="1196" y1="666" x2="1464" y2="666"/><line x1="1196" y1="699" x2="1464" y2="699"/><line x1="1196" y1="732" x2="1464" y2="732"/>
      <line x1="1263" y1="600" x2="1263" y2="764"/><line x1="1330" y1="600" x2="1330" y2="764"/><line x1="1397" y1="600" x2="1397" y2="764"/>
    </g>
