    <!-- Header cards -->
    <text x="340" y="240" fill="#f4f4f5" font-size="26" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">Production plan</text>
    <rect x="340" y="266" width="230" height="96" rx="12" fill="#18181b" stroke="#26262b"/>
    <rect x="360" y="290" width="80" height="10" rx="5" fill="#52525b"/><rect x="360" y="316" width="140" height="22" rx="6" fill="#3f3f46"/>
    <rect x="590" y="266" width="230" height="96" rx="12" fill="#18181b" stroke="#26262b"/>
    <rect x="610" y="290" width="80" height="10" rx="5" fill="#52525b"/><rect x="610" y="316" width="120" height="22" rx="6" fill="#3f3f46"/>
    <rect x="840" y="266" width="240" height="96" rx="12" fill="#18181b" stroke="#a3e635" stroke-opacity=".5"/>
    <rect x="860" y="290" width="80" height="10" rx="5" fill="#52525b"/><rect x="860" y="316" width="160" height="22" rx="6" fill="#a3e635" fill-opacity=".85"/>
